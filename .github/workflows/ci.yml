name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.9"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest
      - run: uv run --locked python scripts/export_openapi.py --check
      - name: Check isolated FIT discovery tooling
        run: uv run --isolated --no-project --no-env-file --python 3.14 --with garmin-fit-sdk==21.221.0 python notebooks/check_fit_discovery.py
      - name: Check isolated API discovery tooling offline
        run: uv run --isolated --no-project --no-env-file --python 3.14 --with garmin-connect-personal-api-python==1.0.0 python notebooks/check_api_discovery.py
      - run: uv run --locked stridelog --version
      - name: Reject tracked private data
        shell: bash
        run: git ls-files -z | xargs -0 uv run --locked python scripts/check_private_files.py

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
